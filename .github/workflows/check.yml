name: PR Checks

on:
  - pull_request

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make lint
      - run: make test
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: MCP-Manager-macOS
          path: dist/
